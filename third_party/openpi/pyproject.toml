[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openpi"
version = "0.1.0+tacinno"
description = "pi0.5 PyTorch implementation (openpi, via FTP-1) vendored for TacInno-VLA; see MODIFICATIONS.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.json"]
